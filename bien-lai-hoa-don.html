<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ht Ng Phước Xuất Biên lai ghi nợ & Hóa đơn chuyển khoản</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#1c2333;--mut:#667085;--pri:#1e3a8a;--line:#d8dee9;--ok:#16a34a;--bad:#b42318}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--pri);color:#fff;padding:14px 18px;font-weight:700;font-size:18px}
nav{display:flex;gap:6px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:8px;font-size:14px;cursor:pointer;color:var(--ink)}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;padding:16px;max-width:1280px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.panel h3{margin:0 0 10px;font-size:15px}
label{display:block;font-size:12.5px;color:var(--mut);margin:9px 0 3px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-size:14px;font-family:inherit}
input:focus{outline:2px solid #93b4ff;border-color:var(--pri)}
.row{display:flex;gap:8px;align-items:end}.row>*{flex:1}
.btn{border:0;background:var(--pri);color:#fff;padding:10px 14px;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit}
.btn.g{background:#fff;color:var(--pri);border:1px solid var(--pri)}.btn.r{background:#fff;color:var(--bad);border:1px solid var(--bad)}
.btn.s{padding:6px 10px;font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.note{font-size:12px;color:var(--mut);margin-top:10px}
#pvwrap{overflow:hidden;background:#cfd6e4;border-radius:10px;padding:10px}
#pvbox{transform-origin:top left}
.hist{display:grid;gap:10px;padding:16px;max-width:1280px;margin:auto}
.hi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#e0e7ff;color:var(--pri)}.tag.h{background:#dcfce7;color:#166534}
.hide{display:none!important}
/* ===== TỜ A4 ===== */
.sh{width:794px;min-height:1123px;background:#fff;padding:48px 48px 40px;font-family:"Segoe UI",Arial,sans-serif;color:#344054;font-size:14px}
.bl .top{display:flex;justify-content:space-between;border-bottom:3px solid #1e3a8a;padding-bottom:14px;margin-bottom:20px}
.bl h1{margin:0;color:#1e3a8a;font-size:27px}.bl .qg{color:#667085;font-size:13px;margin-top:8px}
.bl .rt{text-align:right;font-size:13px}.bl .rt b{color:#b42318}
.bl .g2{display:grid;grid-template-columns:1fr 330px;gap:14px;margin-bottom:16px}
.bl .bx{border:1px solid #c7d2e6;border-radius:10px;padding:14px 16px;background:#f8f9fc;margin-bottom:14px}
.bl .bx h4{margin:0 0 10px;color:#1e3a8a;font-size:14px;padding-bottom:8px;border-bottom:1px solid #e1e6f0}
.bl .ln{display:flex;gap:10px;padding:6px 0}.bl .ln span{width:140px;flex:none;color:#667085}.bl .ln b{color:#111827}
.bl .qrc{border:1px solid #9cc2f0;background:#eef5ff;border-radius:10px;padding:14px;text-align:center}
.bl .card{background:linear-gradient(160deg,#9fd3ff,#62b0f5);border-radius:14px;padding:26px 18px;min-height:380px}
.bl .inn{background:rgba(255,255,255,.55);border-radius:12px;padding:18px 12px;text-align:center;font-size:10px;color:#334155}
.bl .qimg{background:#fff;border-radius:8px;width:170px;height:170px;margin:12px auto;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#999;font-size:12px}
.bl .qimg img{width:100%;height:100%;object-fit:contain}
.bl .qcap{font-weight:700;color:#1e3a8a;font-size:12.5px;margin-top:10px}
.bl .warn{background:#fffbe6;border:1px solid #f3dc87;border-radius:8px;padding:14px 16px;color:#7a3b0a;font-size:13px;margin-bottom:14px}
.bl .warn h5{margin:0 0 8px;font-size:14px}.bl .warn li{margin:6px 0}.bl .warn ul{margin:0;padding-left:16px}
.bl .leg{background:#f0f3f8;border-left:4px solid #0a84d6;padding:12px 14px;font-style:italic;font-size:13px;margin-bottom:22px}
.bl .sg{display:flex;justify-content:space-around;text-align:center}.bl .sg b.t{color:#1e3a8a}.bl .sg i{display:block;color:#888;font-size:12px}
.bl .sg .nm{margin-top:60px;font-weight:700;color:#111}
.hd{text-align:center}
.hd .ck{width:64px;height:64px;border-radius:50%;background:#16a34a;color:#fff;font-size:38px;line-height:64px;margin:30px auto 12px}
.hd h2{margin:0;color:#15803d;font-size:23px}.hd .sub{color:#667085;margin:6px 0 24px}
.hd .am{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:18px;margin-bottom:22px}
.hd .am small{color:#667085;display:block}.hd .am b{font-size:32px;color:#14532d}
.hd .sec{text-align:left;border:1px solid #e4e7ec;border-radius:10px;padding:14px 18px;margin-bottom:14px}
.hd .sec h4{margin:0 0 8px;color:#1e3a8a;font-size:13.5px;padding-bottom:6px;border-bottom:1px solid #eef0f4}
.hd .ln{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px dashed #eef0f4}.hd .ln:last-child{border:0}
.hd .ln span{color:#667085}.hd .ln b{color:#111827;text-align:right}
.hd .ft{color:#667085;font-size:12.5px;margin-top:26px;line-height:1.7}
#off{position:fixed;left:-9999px;top:0}
@media print{body>*:not(#pa){display:none!important}#pa{position:static!important;left:0!important}.sh{box-shadow:none}@page{size:A4;margin:0}}
</style>
</head>
<body>
<header>Biên lai ghi nợ & Hóa đơn chuyển khoản</header>
<nav>
<button id="tBL" class="on" onclick="go('bl')">Biên lai ghi nợ</button>
<button id="tHD" onclick="go('hd')">Hóa đơn thanh toán</button>
<button id="tHS" onclick="go('hs')">Lịch sử (<span id="cnt">0</span>)</button>
</nav>
<main id="ed">
<div class="panel"><h3 id="ft">Thông tin</h3><div id="form"></div>
<div class="acts">
<button class="btn" onclick="save()">Lưu vào lịch sử</button>
<button class="btn g" onclick="pdf(cur())">Tải PDF</button>
<button class="btn g" onclick="prn(cur())">In PDF</button>
<button class="btn g" onclick="fresh()">Tạo mới</button>
</div>
<div class="note">Dữ liệu lưu trên trình duyệt của thiết bị này. Chỉ lập chứng từ cho giao dịch có thật.</div></div>
<div id="pvwrap"><div id="pvbox"></div></div>
</main>
<section id="hs" class="hist hide"></section>
<div id="off"></div><div id="pa" style="position:fixed;left:-9999px;top:0"></div>

<script>
const $=id=>document.getElementById(id);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='bl_hd_history_v1';
const today=()=>new Date().toISOString().slice(0,10);
const nowLocal=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const money=n=>(Number(n)||0).toLocaleString('vi-VN');
const dmy=s=>{if(!s)return'';const[a,b,c]=s.slice(0,10).split('-');return c+'/'+b+'/'+a};
const WD=['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];
const hanTxt=s=>{if(!s)return'';const[y,m,d]=s.split('-').map(Number);return WD[new Date(y,m-1,d).getDay()]+', ngày '+d+' tháng '+m+' năm '+y};
const D=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
function r3(n,full){const t=n/100|0,c=(n%100/10)|0,u=n%10;let s='';if(t||full)s+=D[t]+' trăm ';
 if(c>1){s+=D[c]+' mươi ';s+=u==1?'mốt ':u==5?'lăm ':u?D[u]+' ':''}
 else if(c==1){s+='mười ';s+=u==5?'lăm ':u?D[u]+' ':''}
 else if(u){if(t||full)s+='lẻ ';s+=D[u]+' '}return s}
function words(n){n=Math.floor(Number(n)||0);if(!n)return'Không đồng';const G=['','nghìn','triệu','tỷ'];let p=[],i=0;
 while(n>0){p.unshift([n%1000,i++]);n=Math.floor(n/1000)}
 let s='';p.forEach(([v,k],ix)=>{if(v)s+=r3(v,ix>0)+G[k]+' '});s=s.trim();return s.charAt(0).toUpperCase()+s.slice(1)+' đồng chẵn'}
const rnd=n=>String(Math.floor(Math.random()*Math.pow(10,n))).padStart(n,'0');
const hist=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(_){return[]}};
const wr=a=>{try{localStorage.setItem(KEY,JSON.stringify(a))}catch(_){alert('Không lưu được: bộ nhớ trình duyệt đầy hoặc bị chặn.')}};
function uniq(type,fn){const used=new Set(hist().map(h=>h.d.code));let c;do{c=fn()}while(used.has(c));return c}
const genBL=()=>uniq('bl',()=>rnd(4)+'/BLTNNHP/'+rnd(4)+'/'+rnd(4));
const genHD=()=>uniq('hd',()=>'HDTTNHP/7788/'+rnd(4));

const FIELDS={
bl:[['ngay','Ngày lập','date'],['cho','Người cho mượn','text'],['muon','Người mượn nợ','text'],['tien','Số tiền mượn (VNĐ)','number'],['chu','Bằng chữ (tự động, có thể sửa)','text'],['lai','Lãi suất quá hạn (%/ngày)','number'],['phi','Phí nhắc nợ (VNĐ/tuần)','number'],['qrTen','QR: Tên chủ tài khoản','text'],['qrStk','QR: Số tài khoản','text'],['qrNh','QR: Ngân hàng / chi nhánh','text'],['qrNd','QR: Nội dung (dòng cuối thẻ)','text']],
hd:[['tien','Số tiền giao dịch (VNĐ)','number'],['ft','Mã giao dịch (FT ID)','text'],['tg','Thời gian thực hiện','datetime-local'],['tt','Trạng thái','text'],['nd','Nội dung chuyển khoản','text'],['tenDi','Tên tài khoản đi','text'],['nhDi','Ngân hàng chuyển','text'],['stkDi','Số tài khoản đi','text'],['tenDen','Tên tài khoản đến','text'],['nhDen','Ngân hàng nhận','text'],['stkDen','Số tài khoản đến','text']]};
const blank=t=>t=='bl'?{ngay:today(),cho:'',muon:'',tien:'',chu:'',hans:[{han:today(),tien:''}],lai:0.055,phi:2000,qrTen:'',qrStk:'',qrNh:'',qrNd:'',qr:'',code:genBL()}
 :{tien:'',ft:'FT'+rnd(11),tg:nowLocal(),tt:'Thành công',nd:'',tenDi:'',nhDi:'',stkDi:'',tenDen:'',nhDen:'',stkDen:'',code:genHD()};

let type='bl',d=blank('bl'),editId=null;

function go(v){['BL','HD','HS'].forEach(x=>$('t'+x).classList.remove('on'));
 if(v=='hs'){$('tHS').classList.add('on');$('ed').classList.add('hide');$('hs').classList.remove('hide');drawHist();return}
 $('hs').classList.add('hide');$('ed').classList.remove('hide');$('t'+v.toUpperCase()).classList.add('on');
 if(v!=type||editId){type=v;editId=null;d=blank(v)}build()}
function fresh(){editId=null;d=blank(type);build()}
function build(){
 $('ft').textContent=(type=='bl'?'Biên lai ghi nợ':'Hóa đơn thanh toán')+(editId?' (đang chỉnh sửa)':'');
 let h=`<label>${type=='bl'?'Số biên lai':'Mã giao dịch'} (tự tạo, có thể sửa)</label><div class="row"><input id="f_code" value="${e(d.code)}" oninput="d.code=this.value;draw()"><button class="btn g s" style="flex:none" onclick="regen()">Đổi số</button></div>`;
 FIELDS[type].forEach(([k,l,t])=>{h+=`<label>${l}</label><input id="f_${k}" type="${t}" ${t=='number'?'step="any"':''} value="${e(d[k])}" oninput="chg('${k}',this.value)">`;if(type=='bl'&&k=='chu')h+=hform()});
 if(type=='bl')h+=`<label>Ảnh mã QR (tải lên: tự cắt QR và điền thông tin)</label><input type="file" accept="image/*" onchange="upQR(this.files[0])"><label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:13.5px"><input type="checkbox" style="width:auto" ${autoCrop?'checked':''} onchange="autoCrop=this.checked;procQR()"> Tự động cắt xén, chỉ lấy mã QR giao dịch</label><div class="note">${e(qrMsg)}</div>${d.qr?'<button class="btn r s" style="margin-top:6px" onclick="d.qr=\'\';build()">Xóa ảnh QR</button>':''}`;
 $('form').innerHTML=h;draw()}
function regen(){d.code=type=='bl'?genBL():genHD();$('f_code').value=d.code;draw()}
function chg(k,v){d[k]=v;if(type=='bl'&&k=='tien'){d.chu=v?words(v):'';$('f_chu').value=d.chu}draw()}
function upQR_old(f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=600,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);d.qr=c.toDataURL('image/png');build()};im.src=r.result};r.readAsDataURL(f)}

function tpl(t,x){
 if(t=='bl'){const lai=Number(x.lai)||0,nam=(Math.floor(lai*365*10)/10).toFixed(1),phi=money(x.phi),H=hs(x),n=H.length,hh=dmy(H[n-1].han),all=H.map(z=>dmy(z.han)).join(', '),AP=n>1?'hạn của từng kỳ ('+all+')':'ngày '+hh;
 return `<div class="sh bl"><div class="top"><div><h1>BIÊN LAI GHI NỢ</h1><div class="qg">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM — ĐỘC LẬP - TỰ DO - HẠNH PHÚC</div></div><div class="rt">Số biên lai: <b>${e(x.code)}</b><br><span style="line-height:2">Ngày lập: ${dmy(x.ngay)}</span></div></div>
<div class="g2"><div>
<div class="bx"><h4>1. THÔNG TIN GIAO DỊCH NỢ</h4>
<div class="ln"><span>Người cho mượn:</span><b>${e(x.cho)}</b></div>
<div class="ln"><span>Người mượn nợ:</span><b>${e(x.muon)}</b></div>
<div class="ln"><span>Số tiền mượn:</span><b style="color:#b42318">${money(x.tien)} VNĐ</b></div>
<div class="ln"><span>Bằng chữ:</span><i>${e(x.chu)}</i></div>
<div class="ln"><span>Hạn trả thỏa thuận:</span><b style="color:#d97706">${n>1?H.map((z,i)=>'Kỳ '+(i+1)+': '+hanTxt(z.han)+(z.tien?' — '+money(z.tien)+' VNĐ':'')).join('<br>'):hanTxt(H[0].han)}</b></div></div>
<div class="bx"><h4>2. LÃI SUẤT & PHÍ PHÁT SINH KHI QUÁ HẠN</h4>
<div class="ln"><span>Thời điểm áp dụng:</span><b>Sau hết ${AP}</b></div>
<div class="ln"><span>Lãi suất quá hạn:</span><b>${String(lai).replace('.',',')}% / ngày (tương đương ${String(nam).replace('.',',')}%/năm)</b></div>
<div class="ln"><span>Phí dịch vụ nhắc nợ:</span><b>${phi} VNĐ / tuần (thỏa thuận trước)</b></div></div></div>
<div class="qrc"><div class="card"><div class="inn"><b style="font-size:11px">${e(x.qrNh?x.qrNh+' · ':'')}VIETQR · napas 247</b>
<div class="qimg">${x.qr?`<img src="${x.qr}">`:'Ảnh mã QR'}</div>
<b style="font-size:11px">${e(x.qrTen)}</b><br>Tài khoản: ${e(x.qrStk)}<br>${e(x.qrNh)}<br><div style="margin-top:8px">${e(x.qrNd)}</div></div></div>
<div class="qcap">QUÉT MÃ VIETQR ĐỂ THANH TOÁN NỢ</div></div></div>
<div class="warn"><h5>⚠️ LƯU Ý QUAN TRỌNG ĐỐI VỚI NGƯỜI MƯỢN NỢ:</h5><ul>
<li>Người mượn nợ (${e(x.muon)}) cần đọc kỹ toàn bộ thông tin cá nhân, số tiền đã mượn, hạn trả nợ cùng quy định lãi suất và phí dịch vụ phát sinh trước khi ký xác nhận.</li>
<li>Nếu trả nợ đúng hoặc trước ${AP}, số tiền phải trả duy nhất là tiền gốc <b>${money(x.tien)} VNĐ</b> (không phát sinh bất kỳ khoản phí hay lãi nào).</li>
<li>Sau hết ${n>1?'hạn của kỳ chưa thanh toán':'ngày '+hh}, phí dịch vụ nhắc nợ (${phi}đ/tuần) và lãi suất (${String(lai).replace('.',',')}%/ngày) sẽ tự động kích hoạt và bắt đầu tính dồn vào tổng tiền nợ.</li></ul></div>
<div class="leg"><b>XÁC NHẬN GIÁ TRỊ PHÁP LÝ:</b> Việc người mượn ký tên bên dưới xác nhận đã hoàn toàn hiểu rõ, tự nguyện đồng ý với toàn bộ các điều khoản nêu trên. Biên lai ghi nợ này có giá trị pháp lý làm căn cứ giải quyết nghĩa vụ tài chính giữa hai bên.</div>
<div class="sg"><div><b class="t">NGƯỜI CHO MƯỢN</b><i>(Ký và ghi rõ họ tên)</i><div class="nm">${e(x.cho)}</div></div><div><b class="t">NGƯỜI MƯỢN NỢ</b><i>(Ký và ghi rõ họ tên)</i><div class="nm">${e(x.muon)}</div></div></div></div>`}
 const tg=x.tg?dmy(x.tg)+' - '+x.tg.slice(11,16)+':00':'';
 return `<div class="sh hd"><div class="ck">✓</div><h2>CHUYỂN KHOẢN THÀNH CÔNG</h2><div class="sub">Hóa đơn xác nhận giao dịch ngân hàng trực tuyến</div>
<div class="am"><small>SỐ TIỀN GIAO DỊCH</small><b>${money(x.tien)} VND</b></div>
<div class="sec"><h4>THÔNG TIN GIAO DỊCH</h4>
<div class="ln"><span>Mã giao dịch</span><b>${e(x.code)}</b></div>
<div class="ln"><span>Mã giao dịch (FT ID)</span><b>${e(x.ft)}</b></div>
<div class="ln"><span>Thời gian thực hiện</span><b>${tg}</b></div>
<div class="ln"><span>Trạng thái</span><b style="color:#16a34a">${e(x.tt)}</b></div>
<div class="ln"><span>Nội dung chuyển khoản</span><b>${e(x.nd)}</b></div></div>
<div class="sec"><h4>THÔNG TIN NGƯỜI CHUYỂN</h4>
<div class="ln"><span>Tên tài khoản đi</span><b>${e(x.tenDi)}</b></div>
<div class="ln"><span>Ngân hàng chuyển</span><b>${e(x.nhDi)}</b></div>
<div class="ln"><span>Số tài khoản đi</span><b>${e(x.stkDi)}</b></div></div>
<div class="sec"><h4>THÔNG TIN NGƯỜI NHẬN</h4>
<div class="ln"><span>Tên tài khoản đến</span><b>${e(x.tenDen)}</b></div>
<div class="ln"><span>Ngân hàng nhận</span><b>${e(x.nhDen)}</b></div>
<div class="ln"><span>Số tài khoản đến</span><b>${e(x.stkDen)}</b></div></div>
<div class="ft">Cảm ơn quý khách đã sử dụng dịch vụ thanh toán trực tuyến.<br>Đây là chứng từ điện tử hợp lệ được tự động tạo bởi hệ thống.</div></div>`}

function draw(){$('pvbox').innerHTML=tpl(type,d);fit()}

/* ===== Đọc, cắt và điền thông tin từ QR ===== */
let qrMsg='';
const BANKS={'970415':'VietinBank','970436':'Vietcombank','970418':'BIDV','970405':'Agribank','970422':'MB Bank','970407':'Techcombank','970416':'ACB','970432':'VPBank','970423':'TPBank','970403':'Sacombank','970437':'HDBank','970441':'VIB','970448':'OCB','970443':'SHB','970426':'MSB','970431':'Eximbank','970440':'SeABank','970449':'LPBank','970409':'BacABank','970429':'SCB','970454':'VietCapitalBank','970412':'PVcomBank','970414':'Oceanbank','970419':'NCB','970424':'ShinhanBank','970425':'ABBANK','970433':'VietBank','970427':'VietABank','970428':'NamABank','970400':'SaigonBank'};
function tlv(s){const o={};let i=0;while(i+4<=s.length){const t=s.substr(i,2),l=parseInt(s.substr(i+2,2),10);if(isNaN(l))break;o[t]=s.substr(i+4,l);i+=4+l}return o}
function vietqr(s){try{const t=tlv(s),m=t['38']?tlv(t['38']):{},a=m['01']?tlv(m['01']):{};return{stk:a['01']||'',bin:a['00']||'',ten:t['59']||'',nd:(t['62']?tlv(t['62'])['08']:'')||''}}catch(_){return{}}}
let lastImg=null,autoCrop=true;
function upQR(f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{lastImg=im;procQR()};im.src=r.result};r.readAsDataURL(f)}
function procQR_old(){const im=lastImg;if(!im)return;
 let res=null;
 if(typeof jsQR=='function')for(const m of [1000,600,1600]){const s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  const q=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:'attemptBoth'});if(q){res={q,s};break}}
 const out=document.createElement('canvas'),o=out.getContext('2d');out.width=out.height=500;o.fillStyle='#fff';o.fillRect(0,0,500,500);
 if(res){const L=res.q.location,P=[L.topLeftCorner,L.topRightCorner,L.bottomLeftCorner,L.bottomRightCorner],xs=P.map(p=>p.x/res.s),ys=P.map(p=>p.y/res.s),
  x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),side=Math.max(x1-x0,y1-y0)*1.03,cx=(x0+x1)/2,cy=(y0+y1)/2;
  if(autoCrop)o.drawImage(im,cx-side/2,cy-side/2,side,side,36,36,428,428);else{const s=Math.min(500/im.width,500/im.height);o.drawImage(im,(500-im.width*s)/2,(500-im.height*s)/2,im.width*s,im.height*s)}
  d.qr=out.toDataURL('image/png');
  const p=vietqr(res.q.data),bank=BANKS[p.bin]||'',got=[];
  if(p.stk){d.qrStk=p.stk;got.push('số tài khoản')}if(bank){d.qrNh=bank;got.push('ngân hàng')}if(p.ten){d.qrTen=p.ten;got.push('tên chủ tài khoản')}if(p.nd){d.qrNd=p.nd;got.push('nội dung')}
  qrMsg='Đã cắt mã QR.'+(got.length?' Đã tự điền: '+got.join(', ')+'.':' QR này không có thông tin tài khoản để điền.')+(p.stk&&!p.ten?' QR không chứa tên chủ tài khoản, hãy nhập tên.':'')}
 else{const s=Math.min(1,500/Math.max(im.width,im.height));out.width=im.width*s;out.height=im.height*s;out.getContext('2d').drawImage(im,0,0,out.width,out.height);d.qr=out.toDataURL('image/png');qrMsg='Không đọc được mã QR trong ảnh nên giữ nguyên ảnh. Hãy dùng ảnh rõ nét hơn hoặc nhập tay.'}
 build()}

/* ===== Định vị QR bằng mật độ điểm tối (không phụ thuộc giải mã) ===== */
function locQR(im){
 const s=Math.min(1,1400/Math.max(im.width,im.height)),W=Math.round(im.width*s),Hh=Math.round(im.height*s),cv=document.createElement('canvas');
 cv.width=W;cv.height=Hh;const cx=cv.getContext('2d',{willReadFrequently:true});cx.fillStyle='#fff';cx.fillRect(0,0,W,Hh);cx.drawImage(im,0,0,W,Hh);
 const px=cx.getImageData(0,0,W,Hh).data,L=new Uint8Array(W*Hh);
 for(let i=0;i<W*Hh;i++)L[i]=(px[4*i]*.299+px[4*i+1]*.587+px[4*i+2]*.114)<110?1:0;
 const C=Math.max(4,Math.round(Math.max(W,Hh)/130)),gw=Math.floor(W/C),gh=Math.floor(Hh/C),G=new Uint8Array(gw*gh);
 for(let gy=0;gy<gh;gy++)for(let gx=0;gx<gw;gx++){let n=0;for(let yy=0;yy<C;yy++){const o=(gy*C+yy)*W+gx*C;for(let xx=0;xx<C;xx++)n+=L[o+xx]}G[gy*gw+gx]=n/(C*C)>0.3?1:0}
 const seen=new Uint8Array(gw*gh);let best=null;
 for(let st=0;st<gw*gh;st++){if(!G[st]||seen[st])continue;
  const stack=[st];seen[st]=1;let x0=gw,x1=0,y0=gh,y1=0;
  while(stack.length){const p=stack.pop(),px_=p%gw,py=(p/gw)|0;if(px_<x0)x0=px_;if(px_>x1)x1=px_;if(py<y0)y0=py;if(py>y1)y1=py;
   for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=px_+dx,ny=py+dy;if(nx<0||ny<0||nx>=gw||ny>=gh)continue;const q=ny*gw+nx;if(G[q]&&!seen[q]){seen[q]=1;stack.push(q)}}}
  const bw=x1-x0+1,bh=y1-y0+1,asp=bw/bh;if(asp<.75||asp>1.33||bw*C<.12*Math.min(W,Hh))continue;
  let dk=0;for(let yy=y0*C;yy<(y1+1)*C;yy++)for(let xx=x0*C;xx<(x1+1)*C;xx++)dk+=L[yy*W+xx];
  const m=dk/(bw*C*bh*C);if(m>.8||m<.25)continue;
  if(!best||bw*bh>best.a)best={x0,x1,y0,y1,a:bw*bh}}
 if(!best)return null;
 const ax=Math.max(0,(best.x0-1)*C),ay=Math.max(0,(best.y0-1)*C),bx=Math.min(W,(best.x1+2)*C),by=Math.min(Hh,(best.y1+2)*C);
 let mx0=bx,mx1=ax,my0=by,my1=ay;
 for(let y=ay;y<by;y++)for(let x=ax;x<bx;x++)if(L[y*W+x]){if(x<mx0)mx0=x;if(x>mx1)mx1=x;if(y<my0)my0=y;if(y>my1)my1=y}
 if(mx1<=mx0)return null;
 return{x:mx0/s,y:my0/s,w:(mx1-mx0+1)/s,h:(my1-my0+1)/s}}
function qrCanvas(im,b,out,m){const k=document.createElement('canvas');k.width=k.height=out;const t=k.getContext('2d',{willReadFrequently:true});t.fillStyle='#fff';t.fillRect(0,0,out,out);
 const side=Math.max(b.w,b.h),pad=Math.round(out*m),inn=out-2*pad,cx=b.x+b.w/2,cy=b.y+b.h/2;t.drawImage(im,cx-side/2,cy-side/2,side,side,pad,pad,inn,inn);
 const id=t.getImageData(0,0,out,out),a=id.data;for(let i=0;i<a.length;i+=4){const v=(a[i]*.299+a[i+1]*.587+a[i+2]*.114)<128?0:255;a[i]=a[i+1]=a[i+2]=v;a[i+3]=255}t.putImageData(id,0,0);return k}
function fullCanvas(im,out){const k=document.createElement('canvas');const s=Math.min(1,out/Math.max(im.width,im.height));k.width=out>=1000?Math.round(im.width*s):out;k.height=out>=1000?Math.round(im.height*s):out;const t=k.getContext('2d',{willReadFrequently:true});t.fillStyle='#fff';t.fillRect(0,0,k.width,k.height);
 const f=Math.min(k.width/im.width,k.height/im.height);t.drawImage(im,(k.width-im.width*f)/2,(k.height-im.height*f)/2,im.width*f,im.height*f);k.k=f;return k}
function scl(cv,k){if(k==1)return cv;const c=document.createElement('canvas');c.width=Math.round(cv.width*k);c.height=Math.round(cv.height*k);c.getContext('2d',{willReadFrequently:true}).drawImage(cv,0,0,c.width,c.height);return c}
async function dec(cv){
 try{if('BarcodeDetector' in window){const r=await new BarcodeDetector({formats:['qr_code']}).detect(cv);if(r[0]&&r[0].rawValue)return{data:r[0].rawValue,pts:r[0].cornerPoints}}}catch(_){}
 if(typeof jsQR!='function')return null;
 for(const k of [1,.7,.5,.35]){const c=scl(cv,k),id=c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,c.width,c.height);
  let q=jsQR(id.data,c.width,c.height,{inversionAttempts:'attemptBoth'});
  if(!q||!q.data){const b=new Uint8ClampedArray(id.data);for(let i=0;i<b.length;i+=4){const v=(b[i]*.299+b[i+1]*.587+b[i+2]*.114)<128?0:255;b[i]=b[i+1]=b[i+2]=v}q=jsQR(b,c.width,c.height,{inversionAttempts:'attemptBoth'})}
  if(q&&q.data){const L=q.location;return{data:q.data,pts:[L.topLeftCorner,L.topRightCorner,L.bottomLeftCorner,L.bottomRightCorner].map(p=>({x:p.x/k,y:p.y/k}))}}}
 return null}
const noDau=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D');
async function procQR(){const im=lastImg;if(!im)return;
 let box=locQR(im),res=null;
 if(box)res=await dec(qrCanvas(im,box,800,0.14));
 if(!res){for(const m of [1000,1600]){const fc=fullCanvas(im,m);res=await dec(fc);if(res){if(!box&&res.pts){const xs=res.pts.map(p=>p.x/fc.k),ys=res.pts.map(p=>p.y/fc.k),x0=Math.min(...xs),y0=Math.min(...ys);box={x:x0,y:y0,w:Math.max(...xs)-x0,h:Math.max(...ys)-y0}}break}}}
 const cropped=!!(box&&autoCrop);
 d.qr=(cropped?qrCanvas(im,box,500,0.07):fullCanvas(im,500)).toDataURL('image/png');
 if(res){const p=vietqr(res.data),bank=BANKS[p.bin]||'',got=[];
  if(p.stk){d.qrStk=p.stk;got.push('số tài khoản')}if(bank){d.qrNh=bank;got.push('ngân hàng')}if(p.nd){d.qrNd=p.nd;got.push('nội dung')}
  if(p.ten){d.qrTen=p.ten;got.push('tên chủ tài khoản')}
  else if(p.stk&&d.cho&&!d.qrTen){d.qrTen=noDau(d.cho).toUpperCase();got.push('tên chủ tài khoản (theo Người cho mượn)')}
  qrMsg=(cropped?'Đã cắt mã QR. ':'Đã đọc mã QR. ')+(got.length?'Đã tự điền: '+got.join(', ')+'.':'QR này không có thông tin tài khoản để điền.')+(p.stk&&!p.ten&&!d.qrTen?' QR không chứa tên chủ tài khoản, hãy nhập tên.':'')}
 else qrMsg=box?(cropped?'Đã cắt mã QR':'Đã tìm thấy mã QR')+' nhưng chưa đọc được dữ liệu để tự điền. Hãy dùng ảnh rõ nét hơn hoặc nhập tay.':'Không tìm thấy mã QR trong ảnh nên giữ nguyên ảnh. Hãy dùng ảnh rõ nét hơn hoặc nhập tay.';
 build()}

cnt();build();
